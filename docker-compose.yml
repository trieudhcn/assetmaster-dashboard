name: assetmaster

x-production-logging: &production-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ASSETMASTER_APP_IMAGE:-assetmaster:production}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ASSETMASTER_BIND_IP:-127.0.0.1}:${ASSETMASTER_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NODE_ENV: production
      PORT: "3000"
      SELF_HOSTED_AUTH_ENABLED: "true"
      SELF_HOSTED_SETUP_ENABLED: "${ASSETMASTER_SETUP_ENABLED:-true}"
      ASSETMASTER_AUTO_MIGRATE: "${ASSETMASTER_AUTO_MIGRATE:-true}"
      SELF_HOSTED_RUNTIME_CONFIG_PATH: /data/assetmaster/runtime.json
      SELF_HOSTED_FILE_STORAGE_ROOT: /data/files
      ASSETMASTER_DB_HOST: mysql
      ASSETMASTER_DB_PORT: "3306"
      ASSETMASTER_DB_NAME: ${ASSETMASTER_DB_NAME:-assetmaster}
      ASSETMASTER_DB_USER: ${ASSETMASTER_DB_USER:-assetmaster}
      MYSQL_APP_PASSWORD_FILE: /run/secrets/mysql_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SELF_HOSTED_SETUP_TOKEN_FILE: /run/secrets/setup_token
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    volumes:
      - assetmaster_runtime:/data/assetmaster
      - assetmaster_files:/data/files
    secrets:
      - mysql_app_password
      - jwt_secret
      - setup_token
      - redis_password
    networks:
      - assetmaster_edge
      - assetmaster_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 200
    mem_limit: ${ASSETMASTER_APP_MEMORY_LIMIT:-768m}
    tmpfs:
      - /tmp:mode=1777,size=64m
    logging: *production-logging
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:\" + (process.env.PORT || 3000) + \"/readyz\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    stop_grace_period: 1m
    user: "999:999"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max-connections=${ASSETMASTER_MYSQL_MAX_CONNECTIONS:-200}
      - --innodb-buffer-pool-size=${ASSETMASTER_MYSQL_BUFFER_POOL:-512M}
      - --max-allowed-packet=64M
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_DATABASE: ${ASSETMASTER_DB_NAME:-assetmaster}
      MYSQL_USER: ${ASSETMASTER_DB_USER:-assetmaster}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - mysql_app_password
      - mysql_root_password
    networks:
      - assetmaster_backend
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ASSETMASTER_MYSQL_MEMORY_LIMIT:-1024m}
    logging: *production-logging
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$(cat /run/secrets/mysql_root_password)" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    user: "999:999"
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --protected-mode yes --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/redis_password)"'
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_MAXMEMORY: ${ASSETMASTER_REDIS_MAX_MEMORY:-192mb}
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    networks:
      - assetmaster_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: ${ASSETMASTER_REDIS_MEMORY_LIMIT:-256m}
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    logging: *production-logging
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  assetmaster_runtime:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ASSETMASTER_DATA_DIR:-/srv/assetmaster/data}/runtime
  assetmaster_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ASSETMASTER_FILES_DIR:-/srv/assetmaster/files}
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ASSETMASTER_DATA_DIR:-/srv/assetmaster/data}/mysql
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ASSETMASTER_DATA_DIR:-/srv/assetmaster/data}/redis

networks:
  assetmaster_edge:
    driver: bridge
  assetmaster_backend:
    driver: bridge
    internal: true

secrets:
  mysql_root_password:
    file: ${ASSETMASTER_SECRETS_DIR:-./secrets}/mysql_root_password.txt
  mysql_app_password:
    file: ${ASSETMASTER_SECRETS_DIR:-./secrets}/mysql_app_password.txt
  redis_password:
    file: ${ASSETMASTER_SECRETS_DIR:-./secrets}/redis_password.txt
  jwt_secret:
    file: ${ASSETMASTER_SECRETS_DIR:-./secrets}/jwt_secret.txt
  setup_token:
    file: ${ASSETMASTER_SECRETS_DIR:-./secrets}/setup_token.txt
