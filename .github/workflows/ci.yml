name: AssetMaster CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: assetmaster-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed operational files
        run: >
          pnpm exec prettier --check
          .github/workflows/ci.yml
          docker-compose.yml
          docs/production-readiness-checklist.md
          server/_core/healthRoutes.ts
          server/_core/index.ts
          server/healthRoutes.test.ts

      - name: Typecheck
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Build production bundle
        run: pnpm run build
