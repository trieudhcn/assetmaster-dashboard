    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>AssetMaster — Quản lý tài sản doanh nghiệp</title>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (
          !endpoint ||
          !websiteId ||
          endpoint.includes("%VITE_") ||
          websiteId.includes("%VITE_")
        ) {
          return;
        }
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/+$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.body.appendChild(analytics);
      })();
    </script>
  </body>
</html>
